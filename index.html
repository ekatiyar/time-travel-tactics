<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time travel tactics</title>
<style>
  :root{
    color-scheme:dark;
    --surface-0:#17161A; --surface-1:#212024; --surface-2:#2B2A2F;
    --text-primary:#EDEAE4; --text-secondary:#A8A49C; --text-muted:#787469;
    --border:#37353B; --btn-border:#4E4B53;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --surface-0:#F6F4F0; --surface-1:#EFECE6; --surface-2:#FFFFFF;
    --text-primary:#2C2C2A; --text-secondary:#5F5E5A; --text-muted:#888780;
    --border:#DDD9D2; --btn-border:#B4B2A9;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:14px 18px 40px;background:var(--surface-0);color:var(--text-primary);
    font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .narrow{max-width:640px;margin:0 auto;}
  h1{font-size:19px;font-weight:500;margin:0 0 2px;}
  .sub{font-size:13px;color:var(--text-secondary);margin:0 0 18px;}
  button{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:8px;
    border:1px solid var(--btn-border);background:transparent;color:inherit;cursor:pointer;}
  button:hover{background:var(--surface-2);}
  a.card{display:block;background:var(--surface-1);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;}
  a.card:hover{background:var(--surface-2);}
  a.card .name{font-family:var(--mono);font-size:14px;}
  a.card .what{font-size:13px;color:var(--text-secondary);margin-top:2px;}
  .tag{font-size:11.5px;color:var(--text-muted);margin-left:6px;}
  .note{font-size:13px;color:var(--text-muted);}
</style>
</head>
<body>
<div class="narrow">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
    <div>
      <h1>Time travel tactics</h1>
      <p class="sub">Playable prototypes.</p>
    </div>
    <button id="btnTheme" title="Switch between dark and light">Light</button>
  </div>

  <a class="card" href="play/">
    <div class="name">Current prototype</div>
    <div class="what">Play the latest build.</div>
  </a>

  <div id="releases"></div>
</div>

<script>
  var THEME_KEY = 'tbtt-theme';
  var btn = document.getElementById('btnTheme');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'light' ? 'Dark' : 'Light';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* storage off */ }
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* storage off */ }
  setTheme(saved === 'light' ? 'light' : 'dark');
  btn.onclick = function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  };

  var box = document.getElementById('releases');
  function note(text) {
    var p = document.createElement('p');
    p.className = 'note';
    p.textContent = text;
    box.appendChild(p);
  }
  fetch('releases.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (releases) {
      releases.forEach(function (rel) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = 'v/' + rel.tag + '/' + rel.entry;
        var name = document.createElement('div');
        name.className = 'name';
        name.textContent = rel.title;
        var meta = document.createElement('span');
        meta.className = 'tag';
        meta.textContent = rel.tag + ' · ' + rel.date;
        name.appendChild(meta);
        var what = document.createElement('div');
        what.className = 'what';
        what.textContent = rel.blurb;
        a.appendChild(name);
        a.appendChild(what);
        box.appendChild(a);
      });
    })
    .catch(function () {
      note('Archived builds are unavailable.');
    });
</script>
</body>
</html>
